[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-system"
version = "0.1.0"
description = "Enterprise AI Knowledge System with reliable, hallucination-resistant document RAG"
authors = [{ name = "AI Knowledge System Team" }]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
